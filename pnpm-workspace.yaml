packages:
  - apps/*
  - apps/*/backend
  - packages/*

dedupePeerDependents: true

allowBuilds:
  '@tailwindcss/oxide': true
  better-sqlite3: true
  core-js: false
  cpu-features: false
  esbuild: true
  exifreader: false
  protobufjs: false
  sharp: true
  ssh2: false
  workerd: true

preferWorkspacePackages: true

shamefullyHoist: false

verifyDepsBeforeRun: install

overrides:
  svelte-highlight: 7.14.1

# These were published inside pnpm's minimumReleaseAge window when the lockfile
# was resolved; without the exemption `pnpm install --frozen-lockfile` rejects
# them. Safe to drop once they age out.
minimumReleaseAgeExclude:
  - '@cloudflare/workers-types@5.20260819.1'
  - '@sveltejs/kit@2.70.3'
